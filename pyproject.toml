[project]
name = "ankigen"
version = "0.1.0"
description = "Generate Anki vocabulary CSVs with LLM-powered sentences and translations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "instructor>=1.13.0",
    "openai>=2.9.0",
    "pycantonese>=3.4.0",
    "python-dotenv>=1.2.1",
    "setuptools>=80.9.0",
]

[project.scripts]
ankigen = "ankigen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankigen"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
