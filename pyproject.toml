[project]
name = "ankigen"
version = "0.1.0"
description = "Generate Anki vocabulary CSVs with LLM-powered sentences and translations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "instructor>=1.13.0",
    "openai>=2.9.0",
    "pycantonese>=3.4.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.2.1",
    "setuptools>=80.9.0",
]

[project.scripts]
ankigen = "ankigen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankigen"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = false  # Different envs need different ignores (local vs pre-commit)
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pycantonese.*", "instructor.*", "pypdf.*"]
ignore_missing_imports = true
